<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CV / Resume</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #525659;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .fallback-message {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn {
            display: inline-block;
            background-color: #2ea44f;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            margin-top: 15px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2c974b;
        }
        object {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Change "cv.pdf" to your exact PDF filename if it is named differently -->
    <object data="RobinCraven_CV.pdf" type="application/pdf">
        <div class="container">
            <div class="fallback-message">
                <h2>My CV</h2>
                <p>Your browser or mobile device cannot view this PDF inline.</p>
                <a href="cv.pdf" class="btn" download>Download CV</a>
            </div>
        </div>
    </object>

</body>
</html>
